name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs_on: ubuntu-latest
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Verificar archivo R
        run: |
          test -f P12.R && echo "P12.R presente" || echo "Falta P12.R"
          test -f README.md && echo "README.md presente" || echo "Falta README.md"
